# Template sensors used by pv_production_dashboard.yaml to scale each panel
# tile's colour. They take the highest value across all PyTap optimizers, so
# they work for any installation without listing entity IDs: every entity on
# a PyTap device of model TS4 is included, whatever its name or area.
#
# This file is a package. Copy it into a packages folder, e.g.
# config/packages/tigo.yaml, with this in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Or paste the "- sensor:" block under your existing "template:" key.
template:
  - sensor:
      # Highest daily energy of any panel (for the energy view)
      - name: "Tigo Max Daily Energy"
        unique_id: tigo_max_daily_energy
        unit_of_measurement: "Wh"
        icon: mdi:solar-panel-large
        state: >
          {% set values = integration_entities('pytap')
               | select('is_device_attr', 'model', 'TS4')
               | select('search', '_daily_energy$')
               | map('states') | select('is_number') | map('float') | list %}
          {{ values | max if values else 0 }}

      # Highest readings-today count of any panel (for the connectivity view)
      - name: "Tigo Max Readings Today"
        unique_id: tigo_max_readings_today
        icon: mdi:check-network
        state: >
          {% set values = integration_entities('pytap')
               | select('is_device_attr', 'model', 'TS4')
               | select('search', '_readings_today$')
               | map('states') | select('is_number') | map('float') | list %}
          {{ values | max if values else 0 }}

      # Highest live power of any panel (for the power view)
      - name: "Tigo Max Power"
        unique_id: tigo_max_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        state: >
          {% set values = integration_entities('pytap')
               | select('is_device_attr', 'model', 'TS4')
               | select('search', '_power$')
               | map('states') | select('is_number') | map('float') | list %}
          {{ values | max if values else 0 }}
