name: Validate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check custom_components/pytap/ tests/ scripts/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -vv --tb=short  # pytest.ini testpaths: tests/ and the parser's tests

  supported-core:
    # The main suite's harness pins HA 2026.10.4; PyTap requires 2026.11, so
    # these harness-free smoke tests run on the minimum supported version.
    name: HA 2026.11 smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install 'homeassistant==2026.11.0' 'serialx==1.15.1' 'aiousbwatcher==1.1.2' 'aiohasupervisor==0.8.1'
      - run: python -m unittest discover -s tests -p core_smoke.py -v
